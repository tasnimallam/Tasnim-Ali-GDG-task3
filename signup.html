<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <title>Sign Up CryptoVault</title>
</head>

<body>
    <main class="auth">

        <section class="auth-side">
            <div class="logo">
                <span class="logo-icon dark">CV</span>
                <span class="logo-text">CryptoVault</span>
            </div>
            <h2>Start your crypto journey today</h2>
            <p>Create a free account and get access to your dashboard in a few seconds.</p>
        </section>

        <section class="auth-form-box">

        <div class="theme-toggle">
            <span>Light Mode</span>
            <label class="switch">
                <input type="checkbox" id="theme" aria-label="Light mode">
                <span class="slider"></span>
            </label>
        </div>
            <h1>Create Account</h1>
            <p class="auth-sub">Fill in your details to get started.</p>

            <div class="auth-switch">
                <a href="login.html">Sign In</a>
                <a href="signup.html" class="active">Sign Up</a>
            </div>

            <form class="auth-form" action="index.html">
                <div class="field">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" minlength="3" required>
                </div>

                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 8 characters"
                        minlength="8" required>
                </div>

                <div class="field">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" placeholder="Repeat your password"
                        minlength="8" required>
                </div>

                <button type="submit" class="btn primary full">Sign Up</button>
            </form>

            <p class="auth-foot">Already have an account? <a href="login.html" class="link">Sign In</a></p>
        </section>

    </main>
</body>

</html>
