<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="fontawesome-free-7.3.1-web/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <title>Login CryptoVault</title>
</head>

<body>
    <main class="auth">

        <section class="auth-side">
            <div class="logo">
                <span class="logo-icon dark">CV</span>
                <span class="logo-text">CryptoVault</span>
            </div>
            <h2>Your gateway to the world of crypto</h2>
            <p>Track your portfolio, follow the markets and manage your wallet in one place.</p>
        </section>

        <section class="auth-form-box">

        <div class="theme-toggle">
            <span>Light Mode</span>
            <label class="switch">
                <input type="checkbox" id="theme" aria-label="Light mode">
                <span class="slider"></span>
            </label>
        </div>
            <h1>Welcome Back</h1>
            <p class="auth-sub">Enter your credentials to continue.</p>

            <div class="auth-switch">
                <a href="login.html" class="active">Sign In</a>
                <a href="signup.html">Sign Up</a>
            </div>

            <form class="auth-form" action="index.html">
                <div class="field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        minlength="8" required>
                </div>

                <div class="auth-row">
                    <label class="check">
                        <input type="checkbox" name="remember"> Remember Me
                    </label>
                    <a href="#" class="link">Forgot Password?</a>
                </div>

                <button type="submit" class="btn primary full">Sign In</button>
            </form>

            <p class="auth-foot">Don't have an account? <a href="signup.html" class="link">Sign Up</a></p>
        </section>

    </main>
</body>

</html>
